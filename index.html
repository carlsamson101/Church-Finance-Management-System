<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Church Finance</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1e3a5f">

  <style>
    /* ---------- Theme ---------- */
    :root {
      --b: #14365d;
      --b2: #1f5fa8;
      --g: #18a05e;
      --r: #d1342b;
      --bg: #f2f5fa;
      --m: #6b7788;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: #16202f;
      padding-bottom: 84px;
    }

    /* ---------- Header & bottom navigation ---------- */
    header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 14px;
      background: linear-gradient(135deg, var(--b), var(--b2));
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 6;
    }
    h1 {
      margin: 0;
      font-size: 17px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #st {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 99px;
      background: #fff3;
      white-space: nowrap;
    }
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      background: #fff;
      border-top: 1px solid #e1e6ef;
      z-index: 7;
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav a {
      flex: 1;
      text-align: center;
      text-decoration: none;
      color: var(--m);
      font-size: 11px;
      padding: 8px 0 6px;
    }
    nav a span { display: block; font-size: 20px; }
    nav a.on { color: var(--b2); font-weight: 700; }

    main { max-width: 820px; margin: auto; padding: 12px; }

    /* ---------- Cards & tiles ---------- */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      margin: 0 0 12px;
      box-shadow: 0 1px 3px #1b2a4414;
      border: 1px solid #e8edf5;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--m);
    }
    .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .tile { background: #f5f8fc; border-radius: 12px; padding: 10px; }
    .tile small { display: block; color: var(--m); font-size: 11px; }
    .tile b { font-size: 17px; }
    .tile.hl { grid-column: 1 / -1; background: var(--b); color: #fff; }
    .tile.hl small { color: #cfe0f5; }
    .tile.hl b { font-size: 22px; }
    .tile.ok b { color: var(--g); }
    .tile.neg b { color: var(--r); }

    .cta {
      display: block;
      text-align: center;
      background: var(--g);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
      font-size: 16px;
      box-shadow: 0 2px 6px #18a05e55;
    }

    /* ---------- List items ---------- */
    .li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eef1f6;
      color: inherit;
      text-decoration: none;
    }
    .li b, .li small { display: block; text-align: right; }
    .li small { color: var(--m); font-size: 12px; }
    .mut { color: var(--m); }

    /* Sticky totals bar (new/edit screen) */
    .stk {
      position: sticky;
      top: 52px;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      background: var(--b);
      color: #fff;
      padding: 8px 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .stk b { font-size: 16px; margin-left: 6px; }

    /* ---------- Form controls ---------- */
    input, select {
      font: inherit;
      padding: 12px;
      border: 1px solid #cfd7e4;
      border-radius: 12px;
      width: 100%;
      background: #fff;
      min-height: 46px;
    }
    input:focus, select:focus { outline: 2px solid var(--b2); border-color: transparent; }

    button, .btn {
      font: inherit;
      background: var(--b2);
      color: #fff;
      border: 0;
      cursor: pointer;
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration: none;
      display: inline-block;
      margin: 2px 0;
      font-weight: 600;
    }
    .s  { background: #e6ebf3; color: #16202f; }  /* secondary button */
    .d  { background: var(--r); }                 /* danger button */
    .sm { padding: 6px 10px; font-size: 13px; }
    label { display: block; margin-bottom: 10px; font-weight: 600; }
    .grid { display: grid; gap: 8px; }

    /* Cash-count row: denomination | quantity | subtotal */
    .row {
      display: grid;
      grid-template-columns: 70px 1fr 120px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .row span { text-align: right; font-weight: 600; }

    /* Key/value line */
    .k { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #d5dce8; }
    .k span:last-child { font-weight: 600; }
    .k.t { font-weight: 700; border-bottom: 2px solid var(--b); }
    .k.t span:last-child { font-size: 20px; }
    .hint { color: var(--m); font-size: 12px; margin: 4px 0 8px; }

    .warn {
      background: #fde8e6;
      color: var(--r);
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      margin-top: 8px;
    }

    /* ---------- Tables ---------- */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td, th { padding: 8px; border-bottom: 1px solid #e3e8f0; text-align: right; white-space: nowrap; }
    td:first-child, th:first-child { text-align: left; }
    .w { overflow-x: auto; }

    /* ---------- Modal ---------- */
    #m {
      position: fixed;
      inset: 0;
      background: #0008;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 9;
    }
    #m.on { display: flex; }
    #m .card { max-width: 460px; width: 100%; max-height: 90vh; overflow: auto; }

    /* ---------- Print ---------- */
    .ph { display: none; text-align: center; }
    @media print {
      body * { visibility: hidden; }
      .pa, .pa * { visibility: visible; }
      .pa { position: absolute; left: 0; top: 0; width: 100%; }
      .np { display: none !important; }
      .ph { display: block; }
      .card { box-shadow: none; border: 1px solid #999; }
    }
  </style>
</head>

<body>
  <header>
    <h1 id="hn">Church Finance</h1>
    <span id="st"></span>
  </header>

  <main id="v"></main>

  <nav>
    <a href="#/"         data-p=""><span>🏠</span>Home</a>
    <a href="#/new"      data-p="new"><span>➕</span>New</a>
    <a href="#/records"  data-p="records"><span>📋</span>Records</a>
    <a href="#/settings" data-p="settings"><span>⚙️</span>Settings</a>
  </nav>

  <div id="m"></div>

  <script>
    /* =====================================================================
       CONSTANTS & STATE
       ===================================================================== */
    // Cash denominations counted
    const DENOMS = [1, 5, 10, 20, 50, 100, 200, 500, 1000];

    // Default settings (editable in the Settings page)
    const DEFAULT_SETTINGS = {
      church: '',
      addr: '',
      tot: 10,      // TOT percentage of total finances
      love: 30,     // Love Gift percentage of total finances
      fuel: 2300,   // Fixed Fuel Fix amount
      sym: '₱'
    };

    let S;                 // current settings
    let R = [];            // all records
    let db;                // IndexedDB handle
    let dr;                // draft record (new/edit screen)
    let MO = new Date().toLocaleDateString('en-CA').slice(0, 7);  // selected month (YYYY-MM)
    let F = '';            // records date filter
    let O = 'd';           // records sort order: d = newest first, a = oldest first

    /* =====================================================================
       SMALL HELPERS
       ===================================================================== */
    const $ = sel => document.querySelector(sel);

    // Round to 2 decimals
    const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;

    // Escape text before putting it in HTML
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
    ));

    // Format money: ₱1,234.00
    const f = n => S.sym + r2(n).toLocaleString('en-PH', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    const today = () => new Date().toLocaleDateString('en-CA');
    const dt = d => new Date(d + 'T00:00').toLocaleDateString('en-PH', {
      year: 'numeric', month: 'long', day: 'numeric'
    });

    // Render into main view / modal
    const V = html => { $('#v').innerHTML = html; };
    const M = html => {
      $('#m').innerHTML = html || '';
      $('#m').classList.toggle('on', !!html);
    };

    // Key/value line. cls = extra class, id = optional element id for live updates
    const K = (label, value, cls = '', id = '') =>
      `<div class="k ${cls}"><span>${label}</span><span ${id ? `id="${id}"` : ''}>${value}</span></div>`;

    // Print header (church name + address)
    const printHeader = () =>
      `<div class="ph"><h2>${esc(S.church)}</h2><div>${esc(S.addr)}</div></div>`;

    /* =====================================================================
       INDEXEDDB STORAGE (works offline, data stays on the device)
       ===================================================================== */
    const openDB = () => new Promise((resolve, reject) => {
      const req = indexedDB.open('churchfin', 1);
      req.onupgradeneeded = () => {
        req.result.createObjectStore('records', { keyPath: 'id' });
        req.result.createObjectStore('kv');
      };
      req.onsuccess = () => { db = req.result; resolve(); };
      req.onerror = () => reject(req.error);
    });

    // Run one operation on an object store inside a transaction
    const tx = (store, mode, fn) => new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => resolve(out && out.result);
      t.onerror = () => reject(t.error);
    });

    /* =====================================================================
       CALCULATION (single source of truth)

       - Total finances = cash + online
       - TOT, Love Gift = percentage of total finances (rounded UP to whole peso)
       - Fuel Fix = fixed amount
       - "base" = TOT + Love Gift + Fuel Fix  → this is what is deducted
       - Additional allocations (extra gifts for pastors) are NOT part of the
         percentage base and are NOT deducted from the church's remaining.
         They are only added to the "Total for Pastors".
       - Remaining = total finances − base − additional expenses
       ===================================================================== */
    const calc = (q, online, p, expenses = [], allocations = []) => {
      const sumAmt = list => r2(list.reduce((a, e) => a + (+e.amt || 0), 0));

      const cash   = r2(DENOMS.reduce((a, d) => a + d * (q[d] || 0), 0));
      const tf     = r2(cash + online);
      const tot    = Math.ceil(r2(tf * p.tot / 100));
      const love   = Math.ceil(r2(tf * p.love / 100));
      const fuel   = r2(p.fuel);
      const alloc  = sumAmt(allocations);
      const exp    = sumAmt(expenses);

      const base   = r2(tot + love + fuel);   // deducted from church finances
      const pas    = r2(base + alloc);        // total received by pastors
      const rem    = r2(tf - base - exp);     // allocations NOT subtracted here
      const pieces = DENOMS.reduce((a, d) => a + (q[d] || 0), 0);

      return { cash, tf, tot, love, fuel, alloc, base, pas, exp, rem, pieces };
    };

    // Recompute the stored totals of a record with the current formula
    const withCalc = r => ({
      ...r,
      c: calc(r.q, r.online, r.p, r.ex || [], r.al || [])
    });

    // Sort records by date (o = 'a' oldest first, otherwise newest first)
    const sorted = o => [...R].sort((a, b) =>
      ((a.date + a.ts) < (b.date + b.ts) ? -1 : 1) * (o == 'a' ? 1 : -1)
    );

    // Sum totals across a list of records
    const sum = list => Object.fromEntries(
      ['cash', 'online', 'tf', 'tot', 'love', 'fuel', 'alloc', 'pas', 'exp', 'rem'].map(k => [
        k,
        r2(list.reduce((a, r) => a + (k == 'online' ? r.online : (r.c[k] || 0)), 0))
      ])
    );

    /* =====================================================================
       VIEW: RECORDS TABLE
       ===================================================================== */
    const table = (list, showActions) => `
      <div class="w"><table>
        <tr>
          <th>Date</th><th>Cash</th><th>Online</th><th>Total</th><th>TOT</th>
          <th>Love Gift</th><th>Fuel Fix</th><th>Pastors</th><th>Remaining</th>
          ${showActions ? '<th class="np"></th>' : ''}
        </tr>
        ${list.map(r => `
          <tr>
            <td>${dt(r.date)}</td>
            <td>${f(r.c.cash)}</td>
            <td>${f(r.online)}</td>
            <td>${f(r.c.tf)}</td>
            <td>${f(r.c.tot)}</td>
            <td>${f(r.c.love)}</td>
            <td>${f(r.c.fuel)}</td>
            <td>${f(r.c.pas)}</td>
            <td style="color:${r.c.rem < 0 ? '#b3261e' : 'inherit'}">${f(r.c.rem)}</td>
            ${showActions ? `
              <td class="np">
                <a class="btn sm" href="#/rec/${r.id}">View</a>
                <a class="btn sm s" href="#/edit/${r.id}">Edit</a>
                <a class="btn sm s" href="#/dup/${r.id}">Copy</a>
                <button class="sm d" onclick="del('${r.id}')">Delete</button>
              </td>` : ''}
          </tr>`).join('') || '<tr><td colspan="10">No records.</td></tr>'}
      </table></div>`;

    /* =====================================================================
       VIEW: HOME / DASHBOARD
       ===================================================================== */
    const viewDashboard = () => {
      const list = sorted();
      const latest = list[0];
      const monthRecords = R.filter(r => r.date.startsWith(MO));
      const m = sum(monthRecords);
      const monthName = new Date(MO + '-01T00:00')
        .toLocaleDateString('en-PH', { month: 'long', year: 'numeric' });

      const tile = (label, value, cls = '') =>
        `<div class="tile ${cls}"><small>${label}</small><b>${f(value)}</b></div>`;

      V(`
        <a class="cta" href="#/new">＋ New Finance Record</a>

        <div class="card">
          <h2>LATEST ${latest ? '· ' + dt(latest.date).toUpperCase() : ''}</h2>
          ${latest ? `
            <div class="tiles">
              ${tile('Total finances', latest.c.tf, 'hl')}
              ${tile('Cash', latest.c.cash)}
              ${tile('Online', latest.online)}
              ${tile('For pastors', latest.c.pas)}
              ${tile('Remaining', latest.c.rem, latest.c.rem < 0 ? 'neg' : 'ok')}
            </div>`
            : '<p class="mut">No records yet. Tap New Finance Record to start.</p>'}
        </div>

        <div class="card">
          <h2>RECENT RECORDS</h2>
          ${list.slice(0, 5).map(r => `
            <a class="li" href="#/rec/${r.id}">
              <span>${dt(r.date)}</span>
              <span><b>${f(r.c.tf)}</b><small>Remaining ${f(r.c.rem)}</small></span>
            </a>`).join('') || '<p class="mut">No records.</p>'}
        </div>

        <div class="card pa">
          ${printHeader()}
          <h2>MONTHLY SUMMARY · ${monthName.toUpperCase()}</h2>
          <div class="np" style="display:flex;gap:8px;margin-bottom:8px">
            <input type="month" value="${MO}" onchange="MO=this.value||MO;viewDashboard()">
            <button class="s" onclick="print()">🖨 Print</button>
          </div>
          ${K('Records', monthRecords.length)}
          ${K('Total cash', f(m.cash))}
          ${K('Total online money', f(m.online))}
          ${K('Total finances', f(m.tf), 't')}
          ${K('Total TOT', f(m.tot))}
          ${K('Total Love Gift', f(m.love))}
          ${K('Total Fuel Fix', f(m.fuel))}
          ${K('Total Additional Allocations (pastors only)', f(m.alloc))}
          ${K('Total for Pastors', f(m.pas))}
          ${K('Total Additional Expenses', f(m.exp))}
          ${K('Total Remaining', f(m.rem), 't')}
        </div>`);
    };

    /* =====================================================================
       VIEW: RECORDS LIST
       ===================================================================== */
    const viewList = () => {
      V(`
        <div class="card np">
          <h2>RECORDS</h2>
          <div class="grid">
            <input type="date" value="${F}" oninput="F=this.value;refreshList()">
            <select onchange="O=this.value;refreshList()">
              <option value="d" ${O == 'd' ? 'selected' : ''}>Newest first</option>
              <option value="a" ${O == 'a' ? 'selected' : ''}>Oldest first</option>
            </select>
            <button class="s" onclick="exportCSV()">Export CSV</button>
          </div>
        </div>
        <div class="card" id="tb"></div>`);
      refreshList();
    };

    const refreshList = () => {
      $('#tb').innerHTML = table(sorted(O).filter(r => !F || r.date == F), true);
    };

    /* =====================================================================
       VIEW: SINGLE RECORD (printable)
       ===================================================================== */
    const viewRecord = id => {
      const r = R.find(x => x.id == id);
      if (!r) { location.hash = '#/records'; return; }

      V(`
        <div class="np">
          <button onclick="print()">Print</button>
          <a class="btn s" href="#/edit/${r.id}">Edit</a>
          <a class="btn s" href="#/dup/${r.id}">Duplicate</a>
          <button class="d" onclick="del('${r.id}')">Delete</button>
        </div>

        <div class="pa">
          ${printHeader()}
          <h2>Finance Record — ${dt(r.date)}</h2>

          <div class="card">
            <h2>CASH COUNT</h2>
            ${DENOMS.map(d => K(`${S.sym}${d.toLocaleString()} × ${r.q[d] || 0}`, f(d * (r.q[d] || 0)))).join('')}
            ${K('Bills/coins counted', r.c.pieces)}
            ${K('TOTAL CASH', f(r.c.cash), 't')}
          </div>

          <div class="card">
            <h2>ONLINE MONEY</h2>
            ${K('Online money', f(r.online))}
          </div>

          <div class="card">
            <h2>TOTAL FINANCES</h2>
            ${K('Total finances', f(r.c.tf), 't')}
          </div>

          <div class="card">
            <h2>PASTOR ALLOCATIONS</h2>
            ${K(`TOT (${r.p.tot}%)`, f(r.c.tot))}
            ${K(`LOVE GIFT (${r.p.love}%)`, f(r.c.love))}
            ${K('FUEL FIX', f(r.c.fuel))}
            ${(r.al || []).map(e => K('+ ' + esc(e.label || 'Allocation'), f(e.amt))).join('')}
            ${K('TOTAL FOR PASTORS', f(r.c.pas), 't')}
          </div>

          <div class="card">
            <h2>REMAINING</h2>
            ${K('Total Finances', f(r.c.tf))}
            ${K('− TOT + Love Gift + Fuel Fix', f(r.c.base))}
            ${(r.ex || []).map(e => K('− ' + esc(e.label || 'Expense'), f(e.amt))).join('')}
            ${K('REMAINING CHURCH FINANCES', f(r.c.rem), 't')}
            ${r.c.rem < 0 ? '<div class="warn">Deductions exceeded total finances.</div>' : ''}
          </div>

          ${r.note ? `<p>Note: ${esc(r.note)}</p>` : ''}
        </div>`);
    };

    /* =====================================================================
       VIEW: NEW / EDIT / DUPLICATE RECORD
       ===================================================================== */
    const viewEdit = (id, duplicate) => {
      const r = id && R.find(x => x.id == id);

      // Build the draft record "dr"
      dr = r ? {
        id: duplicate ? undefined : r.id,
        date: duplicate ? today() : r.date,
        q: { ...r.q },
        online: r.online,
        p: duplicate ? { tot: S.tot, love: S.love, fuel: S.fuel } : { ...r.p },
        note: r.note || '',
        ex: (r.ex || []).map(e => ({ ...e })),
        al: (r.al || []).map(e => ({ ...e }))
      } : {
        date: today(),
        q: {},
        online: 0,
        p: { tot: S.tot, love: S.love, fuel: S.fuel },
        note: '',
        ex: [],
        al: []
      };

      V(`
        <div class="stk">
          <span>Total Finances<b id="tf2"></b></span>
          <span>Remaining<b id="rm2"></b></span>
        </div>

        <div class="card">
          <h2>${dr.id ? 'EDIT' : 'NEW'} FINANCE RECORD — DATE</h2>
          <input type="date" value="${dr.date}" oninput="dr.date=this.value">
        </div>

        <div class="card">
          <h2>CASH COUNT</h2>
          ${DENOMS.map(d => `
            <div class="row">
              <b>${S.sym}${d.toLocaleString()}</b>
              <input type="number" min="0" step="1" inputmode="numeric" placeholder="0"
                     value="${dr.q[d] || ''}" oninput="onQty(${d},this)">
              <span id="s${d}"></span>
            </div>`).join('')}
          ${K('Bills/coins counted', '', '', 'pc')}
          ${K('TOTAL CASH', '', 't', 'tc')}
        </div>

        <div class="card">
          <h2>ONLINE MONEY</h2>
          <label>Total Online Money
            <input type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"
                   value="${dr.online || ''}" oninput="onOnline(this)">
          </label>
        </div>

        <div class="card">
          <h2>TOTAL FINANCES</h2>
          ${K('TOTAL FINANCES (Cash + Online)', '', 't', 'tf')}
        </div>

        <div class="card">
          <h2>PASTOR ALLOCATIONS</h2>
          ${K(`TOT (${dr.p.tot}%)`, '', '', 'vt')}
          ${K(`Love Gift (${dr.p.love}%)`, '', '', 'vl')}
          ${K('Fuel Fix', '', '', 'vf')}
          ${K('+ Additional allocations', '', '', 'va')}
          <div id="al"></div>
          <button class="s" onclick="addItem('al')">+ Add allocation</button>
          <div class="hint">Additional allocations go to the pastors only. They are not counted in
            Total Finances and are not deducted from Remaining.</div>
          ${K('TOTAL FOR PASTORS', '', 't', 'vp')}
        </div>

        <div class="card">
          <h2>REMAINING</h2>
          ${K('Total Finances', '', '', 'r1')}
          ${K('− TOT + Love Gift + Fuel Fix', '', '', 'r2')}
          ${K('− Additional expenses', '', '', 'r3')}
          <div id="ex"></div>
          <button class="s" onclick="addItem('ex')">+ Add expense</button>
          ${K('= REMAINING CHURCH FINANCES', '', 't', 'rem')}
          <div id="wn"></div>
        </div>

        <div class="card">
          <label>Note (optional)
            <input value="${esc(dr.note)}" oninput="dr.note=this.value">
          </label>
          <button onclick="confirmSave()">Review &amp; Save</button>
          <a class="btn s" href="#/">Cancel</a>
        </div>`);

      renderItems();
      paint();
    };

    /* ---- Extra allocation / expense rows ---- */
    const renderItems = () => { renderList('ex'); renderList('al'); };

    // k = 'ex' (expenses) or 'al' (allocations)
    const renderList = k => {
      $('#' + k).innerHTML = dr[k].map((e, i) => `
        <div class="row" style="grid-template-columns:1fr 110px 44px">
          <input placeholder="${k == 'al' ? 'Allocation (e.g. Birthday gift)' : 'Expense (e.g. Water bill)'}"
                 value="${esc(e.label)}" oninput="dr.${k}[${i}].label=this.value">
          <input type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"
                 value="${e.amt || ''}" oninput="onItemAmt('${k}',${i},this)">
          <button class="d sm" onclick="dr.${k}.splice(${i},1);renderList('${k}');paint()">✕</button>
        </div>`).join('');
    };

    const addItem = k => {
      dr[k].push({ label: '', amt: 0 });
      renderList(k);
      paint();
      $('#' + k + ' .row:last-child input').focus();
    };

    const onItemAmt = (k, i, el) => {
      let v = +el.value;
      if (!(v >= 0)) { v = 0; el.value = ''; }
      dr[k][i].amt = r2(v);
      paint();
    };

    /* ---- Live update of all computed fields on the edit screen ---- */
    const paint = () => {
      const c = calc(dr.q, dr.online, dr.p, dr.ex, dr.al);
      const set = (id, text) => { $('#' + id).textContent = text; };

      DENOMS.forEach(d => set('s' + d, f(d * (dr.q[d] || 0))));
      set('pc', c.pieces);
      set('tc', f(c.cash));
      set('tf', f(c.tf));
      set('vt', f(c.tot));
      set('vl', f(c.love));
      set('vf', f(c.fuel));
      set('va', '+ ' + f(c.alloc));
      set('vp', f(c.pas));
      set('r1', f(c.tf));
      set('r2', '− ' + f(c.base));
      set('r3', '− ' + f(c.exp));
      set('tf2', f(c.tf));
      set('rm2', f(c.rem));
      set('rem', f(c.rem));

      $('#wn').className = c.rem < 0 ? 'warn' : '';
      $('#wn').textContent = c.rem < 0
        ? '⚠ Warning: deductions are greater than total finances. Remaining is negative (' + f(c.rem) + ').'
        : '';
      return c;
    };

    const onQty = (d, el) => {
      const v = Math.max(0, Math.floor(+el.value) || 0);
      if (el.value !== '' && +el.value < 0) el.value = 0;
      dr.q[d] = v;
      paint();
    };

    const onOnline = el => {
      let v = +el.value;
      if (!(v >= 0)) { v = 0; el.value = ''; }
      dr.online = r2(v);
      paint();
    };

    /* ---- Confirm & save ---- */
    const confirmSave = () => {
      if (!dr.date) return alert('Please choose a date.');
      const c = paint();
      M(`
        <div class="card">
          <h2>Are you sure you want to save this finance record?</h2>
          ${K('Date', dt(dr.date))}
          ${K('Total Cash', f(c.cash))}
          ${K('Online Money', f(dr.online))}
          ${K('Total Finances', f(c.tf), 't')}
          ${K(`TOT (${dr.p.tot}%)`, f(c.tot))}
          ${K(`Love Gift (${dr.p.love}%)`, f(c.love))}
          ${K('Fuel Fix', f(c.fuel))}
          ${K('Additional Allocations', f(c.alloc))}
          ${K('Total for Pastors', f(c.pas))}
          ${K('Additional Expenses', f(c.exp))}
          ${K('Remaining', f(c.rem), 't')}
          ${c.rem < 0 ? '<div class="warn">⚠ Remaining is negative!</div>' : ''}
          <p>
            <button onclick="save()">Yes, save</button>
            <button class="s" onclick="M()">Go back</button>
          </p>
        </div>`);
    };

    const save = async () => {
      // Drop empty extra rows
      dr.ex = dr.ex.filter(e => e.label || e.amt);
      dr.al = dr.al.filter(e => e.label || e.amt);

      const old = dr.id && R.find(x => x.id == dr.id);
      const rec = {
        id: dr.id || 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        date: dr.date,
        q: dr.q,
        online: dr.online,
        p: dr.p,
        note: dr.note,
        ex: dr.ex,
        al: dr.al,
        c: calc(dr.q, dr.online, dr.p, dr.ex, dr.al),
        ts: old ? old.ts : Date.now(),
        upd: Date.now()
      };

      await tx('records', 'readwrite', s => s.put(rec));
      R = R.filter(x => x.id != rec.id);
      R.push(rec);
      M();
      location.hash = '#/rec/' + rec.id;
    };

    const del = async id => {
      if (!confirm('Delete this record? This cannot be undone.')) return;
      await tx('records', 'readwrite', s => s.delete(id));
      R = R.filter(x => x.id != id);
      location.hash == '#/records' ? route() : (location.hash = '#/records');
    };

    /* =====================================================================
       VIEW: SETTINGS + BACKUP
       ===================================================================== */
    const SETTING_FIELDS = [
      ['church', 'Church name',                'text'],
      ['addr',   'Church address / details',   'text'],
      ['tot',    'TOT percentage (%)',         'number'],
      ['love',   'Love Gift percentage (%)',   'number'],
      ['fuel',   'Fuel Fix amount',            'number'],
      ['sym',    'Currency symbol',            'text']
    ];

    const viewSettings = () => V(`
      <div class="card">
        <h2>SETTINGS</h2>
        <p>Current: TOT ${S.tot}% · Love Gift ${S.love}% · Fuel Fix ${f(S.fuel)}<br>
          <small>Changes apply to new records only. Saved records keep their original values.</small></p>
        ${SETTING_FIELDS.map(([k, label, type]) => `
          <label>${label}
            <input id="c_${k}" type="${type}" step="any" min="0" value="${esc(S[k])}">
          </label>`).join('')}
        <button onclick="saveSettings()">Save settings</button>
      </div>

      <div class="card">
        <h2>BACKUP &amp; EXPORT</h2>
        <button onclick="exportJSON()">Export JSON backup</button>
        <button class="s" onclick="exportCSV()">Export CSV</button>
        <label style="margin-top:12px">Restore JSON backup
          <input type="file" accept=".json,application/json" onchange="importJSON(this)">
        </label>
      </div>`);

    const saveSettings = async () => {
      const next = {};
      for (const [k, , type] of SETTING_FIELDS) {
        const v = $('#c_' + k).value;
        if (type == 'number') {
          if (!(+v >= 0) || v === '') return alert('Enter valid numbers (0 or more).');
          next[k] = +v;
        } else {
          next[k] = v.trim();
        }
      }
      next.sym = next.sym || '₱';
      S = { ...DEFAULT_SETTINGS, ...next };
      await tx('kv', 'readwrite', s => s.put(S, 'settings'));
      alert('Settings saved.');
      route();
    };

    /* ---- Export / import ---- */
    const download = (name, text, mime) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: mime }));
      a.download = name;
      a.click();
    };

    const exportJSON = () => download(
      `church-finance-backup-${today()}.json`,
      JSON.stringify({ v: 1, settings: S, records: R }),
      'application/json'
    );

    const exportCSV = () => {
      const header = [
        'Date', ...DENOMS.map(d => 'x' + d),
        'Total Cash', 'Online', 'Total Finances',
        'TOT %', 'TOT', 'Love %', 'Love Gift', 'Fuel Fix',
        'Additional Allocations', 'Total for Pastors',
        'Additional Expenses', 'Remaining', 'Note'
      ];
      const rows = sorted('a').map(r => [
        r.date, ...DENOMS.map(d => r.q[d] || 0),
        r.c.cash, r.online, r.c.tf,
        r.p.tot, r.c.tot, r.p.love, r.c.love, r.c.fuel,
        r.c.alloc || 0, r.c.pas,
        r.c.exp || 0, r.c.rem, r.note || ''
      ]);
      const csv = [header, ...rows]
        .map(row => row.map(x => `"${String(x).replace(/"/g, '""')}"`).join(','))
        .join('\n');
      download(`church-finance-${today()}.csv`, '\ufeff' + csv, 'text/csv');
    };

    const importJSON = async el => {
      const file = el.files[0];
      if (!file) return;
      try {
        const j = JSON.parse(await file.text());
        const valid = Array.isArray(j.records) &&
          j.records.every(r => r.id && r.date && r.q && r.c && r.p);
        if (!valid) throw new Error('bad file');

        if (!confirm(`Restore ${j.records.length} records? Records with the same ID will be overwritten.`)) return;

        await tx('records', 'readwrite', s => { j.records.forEach(r => s.put(withCalc(r))); });
        if (j.settings) {
          S = { ...DEFAULT_SETTINGS, ...j.settings };
          await tx('kv', 'readwrite', s => s.put(S, 'settings'));
        }
        R = (await tx('records', 'readonly', s => s.getAll())).map(withCalc);
        alert('Backup restored.');
        route();
      } catch (e) {
        alert('Invalid backup file.');
      }
      el.value = '';
    };

    /* =====================================================================
       ROUTER & STARTUP
       ===================================================================== */
    const route = () => {
      const [, page, arg] = location.hash.split('/');
      M();
      $('#hn').textContent = S.church || 'Church Finance';
      document.querySelectorAll('nav a').forEach(a =>
        a.classList.toggle('on', a.dataset.p == (page || ''))
      );

      const pages = {
        '':       viewDashboard,
        new:      () => viewEdit(),
        edit:     () => viewEdit(arg),
        dup:      () => viewEdit(arg, true),
        records:  viewList,
        rec:      () => viewRecord(arg),
        settings: viewSettings
      };
      (pages[page || ''] || viewDashboard)();
      scrollTo(0, 0);
    };

    // Status badge (all data is stored locally on the device)
    const updateStatus = () => {
      const el = $('#st');
      el.textContent = '● Offline mode · local';
      el.style.background = navigator.onLine ? '#1b7f4b' : '#7a5a00';
    };

    (async () => {
      await openDB();

      // Load records and re-apply the current formula so totals are always consistent
      R = (await tx('records', 'readonly', s => s.getAll())).map(withCalc);
      S = { ...DEFAULT_SETTINGS, ...(await tx('kv', 'readonly', s => s.get('settings'))) };

      addEventListener('hashchange', route);
      addEventListener('online', updateStatus);
      addEventListener('offline', updateStatus);
      updateStatus();
      route();

      // Ask the browser not to delete our data
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

      // Offline support (needs sw.js next to this file; skipped when opened as a local file)
      if ('serviceWorker' in navigator && location.protocol != 'file:') {
        navigator.serviceWorker.register('sw.js');
      }
    })();
  </script>
</body>
</html>
